<svg width="140" height="32" viewBox="0 0 86 32" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
	/* Each square takes one of three roles per 9.6s loop, in this order:
	   bottom card (aside, up, into top slot) / then two "shift down one slot" beats.
	   Beats are 3.2s each (1.2s motion + 2s pause), offset so the shift squares
	   move only while the mover is mid-"up". Distances are in rem (1rem =
	   assumed 16px base) rather than px so they scale with the user's
	   font-size/zoom setting instead of staying a fixed physical distance
	   while the rest of the page scales around them. -1.5rem aside,
	   ±0.333331rem per slot. */
	@keyframes tldr-cycle-a {
		0% { transform: translate(0, 0); }
		3.6458% { transform: translate(-1.5rem, 0); }
		9.375% { transform: translate(-1.5rem, -0.666663rem); }
		12.5%, 33.3333% { transform: translate(0, -0.666663rem); }
		36.9792% { transform: translate(0, -0.666663rem); }
		42.7083%, 66.6667% { transform: translate(0, -0.333331rem); }
		70.3125% { transform: translate(0, -0.333331rem); }
		76.0417%, 100% { transform: translate(0, 0); }
	}
	@keyframes tldr-cycle-b {
		0%, 3.6458% { transform: translate(0, 0); }
		9.375%, 33.3333% { transform: translate(0, 0.333331rem); }
		36.9792% { transform: translate(-1.5rem, 0.333331rem); }
		42.7083% { transform: translate(-1.5rem, -0.333331rem); }
		45.8333%, 66.6667% { transform: translate(0, -0.333331rem); }
		70.3125% { transform: translate(0, -0.333331rem); }
		76.0417%, 100% { transform: translate(0, 0); }
	}
	@keyframes tldr-cycle-c {
		0%, 3.6458% { transform: translate(0, 0); }
		9.375%, 36.9792% { transform: translate(0, 0.333331rem); }
		42.7083%, 66.6667% { transform: translate(0, 0.666663rem); }
		70.3125% { transform: translate(-1.5rem, 0.666663rem); }
		76.0417% { transform: translate(-1.5rem, 0); }
		79.1667%, 100% { transform: translate(0, 0); }
	}
	.tldr-square {
		animation-duration: 9.6s;
		animation-timing-function: ease-in-out;
		animation-iteration-count: infinite;
	}
	.tldr-square--c {
		transform:translate(0,0.53125rem);
	}
	.tldr-square--a { animation-name: tldr-cycle-a; }
	.tldr-square--b { animation-name: tldr-cycle-b; }
	.tldr-square--c { animation-name: tldr-cycle-c; }
	@media (prefers-reduced-motion: reduce) {
		.tldr-square {
			animation: none;
		}
	}
</style>
<path class="tldr-square tldr-square--a" d="M26.02 21.3328L15.9995 25.4587L5.979 21.3328L15.9995 17.2068L26.02 21.3328Z" stroke="currentColor"/>
<path class="tldr-square tldr-square--b" d="M26.02 15.9993L15.9995 20.1252L5.979 15.9993L15.9995 11.8733L26.02 15.9993Z" stroke="currentColor"/>
<path class="tldr-square tldr-square--c" d="M26.02 10.666L15.9995 14.792L5.979 10.666L15.9995 6.54004L26.02 10.666Z" stroke="currentColor"/>
